<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>死信任务列表</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="p-4">
<h2>死信任务列表</h2>
<hr>
<div>
  <a href="/admin" class="btn btn-secondary mb-3">返回首页</a>
</div>

<table class="table table-bordered">
  <thead>
  <tr>
    <th>任务详情</th>
    <th>操作</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="taskJson : ${deadTasks}">
    <td th:text="${taskJson}"></td>
    <td>
      <button class="btn btn-sm btn-success" th:onclick="'retryTask(' + '\'' + taskJson + '\'' + ')'">重新投递</button>
    </td>
  </tr>
  </tbody>
</table>

<script>
  function retryTask(taskJson) {
    if (confirm('确认重新投递此任务？')) {
      axios.post('/admin/retry', 'taskJson=' + encodeURIComponent(taskJson), {
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      }).then(response => {
        if (response.data === 'SUCCESS') {
          alert('重新投递成功');
          window.location.reload();
        } else {
          alert('投递失败');
        }
      }).catch(error => {
        console.error(error);
        alert('请求失败');
      });
    }
  }
</script>
</body>
</html>
