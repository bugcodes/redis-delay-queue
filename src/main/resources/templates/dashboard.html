<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>延迟队列管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<h2>延迟队列管理后台</h2>
<hr>
<div class="mb-4">
  <h4>队列状态</h4>
  <p>当前待执行任务数：<span th:text="${queueSize}"></span></p>
  <p>死信队列任务数：<span th:text="${deadSize}"></span></p>
</div>

<div>
  <a href="/admin/dead-letters" class="btn btn-primary">查看死信队列</a>
</div>
</body>
</html>
